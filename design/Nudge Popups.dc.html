<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Doto:wght@400;700;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=block" rel="stylesheet" />
<style>
html,body{margin:0;padding:0;background:#0d0d10}
a{color:#ff4d17;text-decoration:none}
a:hover{color:#ff7a4d}
@keyframes nDrop{0%{transform:translateY(-101%)}100%{transform:translateY(0)}}
@keyframes nLift{0%{transform:translateY(0)}100%{transform:translateY(-101%)}}
@keyframes nFade{from{opacity:0}to{opacity:1}}
</style>
</helmet>
<div style="min-height:100vh;box-sizing:border-box;padding:52px 52px 88px;display:flex;flex-direction:column;gap:34px;font-family:'DM Mono',ui-monospace,monospace;color:#f4f3ef;background:radial-gradient(120% 80% at 25% 0%,#17171d,#0b0b0e 70%)">

  <div style="display:flex;align-items:baseline;gap:13px;flex-wrap:wrap">
    <span style="font-family:'ZCOOL QingKe HuangYou',sans-serif;font-size:28px;line-height:1">nudge pop-ups</span>
    <span style="font-size:11px;letter-spacing:.18em;color:#9a9aa3">EVERY STATE · WHEN IT FIRES · HOW IT LEAVES</span>
  </div>

  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
    <div style="display:flex;flex-direction:column;gap:15px">
      <div style="display:flex;align-items:center;gap:11px">
        <span style="font-family:'ZCOOL QingKe HuangYou',sans-serif;font-size:21px;line-height:1;color:#f4f3ef">{{ g.title }}</span>
        <span style="flex:1;height:1px;background:#1e1e26"></span>
        <span style="font-size:10px;letter-spacing:.16em;color:#8e8e97">{{ g.rule }}</span>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:19px">
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
          <div style="display:flex;flex-direction:column;gap:9px">
            <div style="position:relative;width:320px;height:{{ it.h }};box-sizing:border-box;overflow:hidden;border-radius:9px;background:#0a0a0c">
              <div style="position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;animation:nDrop .52s cubic-bezier(.32,.72,0,1) both;transform-origin:50% 0;margin-top:-1px">
                <div style="position:relative;display:flex;align-items:flex-start;max-width:302px">
                  <span style="width:14px;height:15px;flex:none;margin-right:-1px;background:radial-gradient(circle at 0 100%,transparent 13.5px,#f4f3ef 14px)"></span>
                  <div style="flex:1;min-width:0;box-sizing:border-box;padding:{{ it.pad }};border-radius:0 0 {{ it.radius }} {{ it.radius }};background:#f4f3ef;color:#111114">
                    <div style="display:flex;align-items:center;gap:10px">
                      <span style="font-family:'Material Symbols Rounded';font-size:{{ it.iconSize }};line-height:1;flex:none;color:#ff4d17">{{ it.icon }}</span>
                      <span style="font-size:{{ it.size }};line-height:1.25;flex:1;min-width:0;color:#111114">{{ it.line }}</span>
                    </div>
                    <sc-if value="{{ it.rows }}" hint-placeholder-val="{{ false }}">
                      <div style="display:flex;flex-direction:column;gap:5px;margin-top:10px;padding-top:9px;border-top:1px solid #dcd8d0">
                        <sc-for list="{{ it.rows }}" as="r" hint-placeholder-count="2">
                          <div style="display:flex;align-items:center;gap:10px">
                            <span style="font-size:9px;letter-spacing:.14em;width:44px;flex:none;color:#7a7a84">{{ r.k }}</span>
                            <span style="font-size:11px;flex:1;min-width:0;color:#111114">{{ r.v }}</span>
                          </div>
                        </sc-for>
                      </div>
                    </sc-if>
                  </div>
                  <span style="width:14px;height:15px;flex:none;margin-left:-1px;background:radial-gradient(circle at 100% 100%,transparent 13.5px,#f4f3ef 14px)"></span>
                </div>
              </div>

              <sc-if value="{{ it.keys }}" hint-placeholder-val="{{ false }}">
                <div style="position:absolute;left:6px;right:6px;bottom:0;height:30px;display:flex;gap:5px">
                  <sc-for list="{{ it.keys }}" as="k" hint-placeholder-count="4">
                    <div style="flex:1;border-radius:7px 7px 0 0;display:flex;align-items:center;justify-content:center;background:{{ k.bg }}">
                      <span style="font-size:12px;color:{{ k.fg }}">{{ k.label }}</span>
                    </div>
                  </sc-for>
                </div>
              </sc-if>
            </div>

            <div style="width:320px;display:flex;flex-direction:column;gap:3px">
              <span style="font-size:12px;color:#f4f3ef">{{ it.name }}</span>
              <span style="font-size:10px;line-height:1.4;color:#9a9aa3;text-wrap:pretty">{{ it.when }}</span>
              <span style="font-size:10px;letter-spacing:.1em;color:#ff4d17">{{ it.exit }}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <div style="display:flex;flex-direction:column;gap:13px;padding-top:14px;border-top:1px solid #1e1e26">
    <span style="font-size:11px;letter-spacing:.2em;color:#8e8e97">RULES THAT APPLY TO ALL OF THEM</span>
    <div style="display:flex;flex-direction:column;gap:8px;max-width:760px">
      <sc-for list="{{ rules }}" as="r" hint-placeholder-count="6">
        <div style="display:flex;align-items:flex-start;gap:11px">
          <span style="font-family:Doto,monospace;font-weight:900;font-size:13px;line-height:1.4;flex:none;width:19px;color:#ff4d17">{{ r.n }}</span>
          <span style="font-size:12px;line-height:1.45;color:#c9c8c2;text-wrap:pretty">{{ r.text }}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const SMALL = { h: "108px", pad: "9px 13px 10px", radius: "13px", iconSize: "16px", size: "11px" };
const BIG = { h: "150px", pad: "12px 15px 13px", radius: "16px", iconSize: "20px", size: "12px" };

const KEY = (labels) => labels.map((l) => (l ? { label: l, bg: l === "yes" || l === "ok" ? "#f4f3ef" : "#1d1d24", fg: l === "yes" || l === "ok" ? "#0b0b0d" : "#c9c8c2" } : { label: "", bg: "#101015", fg: "transparent" }));

const GROUPS = [
  {
    title: "reward and progress",
    rule: "NEVER DURING A SESSION",
    items: [
      { name: "start credit", icon: "bolt", line: "+1 for starting", when: "Fires once when a task first begins. Not repeatable — switching away and back gives nothing.", exit: "AUTO · 2.2s", ...SMALL },
      { name: "reward in reach", icon: "savings", line: "three more points", when: "Shown on the standby screen when the bank is within one task of the goal.", exit: "AUTO · 3.6s", ...SMALL },
    ],
  },
  {
    title: "guard rails",
    rule: "BLOCKS AN ACTION, EXPLAINS ONCE",
    items: [
      { name: "too early to claim", icon: "block", line: "finish it first", when: "Claim pressed before a minute of real work. Homework and revision cannot be self-declared done.", exit: "AUTO · 2.4s", ...SMALL },
      { name: "break not open", icon: "schedule", line: "break in 3 min", when: "Break pressed inside the first five minutes of a session. Counts down rather than refusing flatly.", exit: "AUTO · 2.6s", ...SMALL },
      { name: "skip used", icon: "low_priority", line: "moved to the end", when: "Skip moves the task to the back of the list and keeps its progress. Two per day.", exit: "AUTO · 2.6s", ...SMALL },
      { name: "no skips left", icon: "block", line: "no skips left", when: "Third skip attempt in a day. The list has to be finished as it stands.", exit: "AUTO · 2.4s", ...SMALL },
    ],
  },
  {
    title: "assistant",
    rule: "TOUCH PAD ONLY, NO WAKE WORD",
    items: [
      { name: "listening", icon: "blur_on", line: "listening", when: "Touch pad pressed. During a session it stays a slab and never takes the screen.", exit: "AUTO · 2.6s", ...SMALL },
      { name: "needs your ok", icon: "edit_note", line: "email Mr Hale about the deadline?", when: "Any agent job that sends, buys or changes the week stops here first.", exit: "KEY 1 YES · KEY 4 NO", keys: KEY(["yes", "", "", "no"]), rows: [{ k: "TO", v: "Mr Hale" }, { k: "ASKS", v: "two more days" }], ...BIG },
      { name: "saved", icon: "bookmark_added", line: "saved to your notes", when: "A voice note or answer lands in the app. No action needed.", exit: "AUTO · 2.6s", ...SMALL },
    ],
  },
  {
    title: "time of day",
    rule: "INTERRUPTS ONLY WHEN IT MATTERS",
    items: [
      { name: "pack your bag", icon: "backpack", line: "four books for tomorrow", when: "All tasks done on a school evening. Leads into the bag checklist.", exit: "KEY 1 OPENS LIST", keys: KEY(["list", "", "", "later"]), ...SMALL },
      { name: "bedtime", icon: "bedtime", line: "time to sleep", when: "Past 11pm. Monochrome, no orange, and it reopens the desktop window if that was shut.", exit: "AUTO · 5s", ...SMALL },
      { name: "birthday", icon: "cake", line: "it's your mum's birthday", when: "Morning of the day only, from the list in the app. Never a countdown.", exit: "AUTO · 4s", ...SMALL },
    ],
  },
];

class Component extends DCLogic {
  renderVals() {
    return {
      groups: GROUPS.map((g) => ({
        title: g.title,
        rule: g.rule,
        items: g.items.map((it) => ({ ...it, rows: it.rows || null, keys: it.keys || null })),
      })),
      rules: [
        "One at a time. A new pop-up replaces the old one rather than stacking.",
        "The shape always touches the top edge. It grows down out of the bezel and retracts back into it, never floating.",
        "Orange is only ever the icon or the whole slab. Body text stays near-black on off-white.",
        "Anything needing an answer maps to a physical key and says which. Anything that does not, leaves on its own.",
        "During a session nothing takes the full screen. The countdown stays visible behind every slab.",
        "In bedtime mode the accent is dropped entirely and the slab dims with the screen.",
      ].map((text, i) => ({ n: String(i + 1).padStart(2, "0"), text })),
    };
  }
}
</script>
</body>
</html>
