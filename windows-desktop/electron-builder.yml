# One-click installer for Windows. Double-click → installs for this user (no admin) → opens.
appId: studio.peterz.nudge
productName: Nudge
copyright: peterzstudio
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**
  - package.json
extraResources:
  - from: dist-renderer
    to: renderer
  - from: dist-extension
    to: extension
  - from: dist-connector
    to: connector
  - from: build/tray.png
    to: build/tray.png
asar: true
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png
  artifactName: Nudge-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nudge
  deleteAppDataOnUninstall: false
publish: null
